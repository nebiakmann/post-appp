version: '3.8'

services:
  # MySQL Veritabanı
  mysql:
    image: mysql:8.0
    container_name: pos_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pos_root_password
      MYSQL_DATABASE: pos_app
      MYSQL_USER: pos_user
      MYSQL_PASSWORD: pos_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - pos_network

  # PHP Apache
  web:
    image: php:8.1-apache
    container_name: pos_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=pos_app
      - DB_USER=pos_user
      - DB_PASS=pos_password
    networks:
      - pos_network
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y libpng-dev libjpeg-dev libfreetype6-dev &&
        docker-php-ext-configure gd --with-freetype --with-jpeg &&
        docker-php-ext-install gd pdo pdo_mysql mysqli &&
        a2enmod rewrite &&
        apache2-foreground
      "

  # phpMyAdmin (Opsiyonel)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pos_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: pos_root_password
    depends_on:
      - mysql
    networks:
      - pos_network

volumes:
  mysql_data:

networks:
  pos_network:
    driver: bridge

